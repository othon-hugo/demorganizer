[build-system]
requires = ["setuptools>=72"]
build-backend = "setuptools.build_meta"

[project]
name = "demorganizer"
version = "2025.7.0"
description = "A Python toolkit for automating common Computer Science calculations, covering Boolean algebra, propositional logic, and numerical methods."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Othon Hugo" }]
keywords = [
    "boolean algebra",
    "propositional logic",
    "de morgan",
    "numerical methods",
    "bisection",
    "false position",
    "truth table",
    "computer science",
    "education",
]
requires-python = ">=3.11"
dependencies = ["tabulate>=0.9.0"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Education",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/othonhugo/demorganizer"
Repository = "https://github.com/othonhugo/demorganizer.git"
Issues = "https://github.com/othonhugo/demorganizer/issues"

[project.optional-dependencies]
dev = ["mypy>=1.0", "flake8>=7.0", "pytest>=8.0"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
check_untyped_defs = true
ignore_missing_imports = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
explicit_package_bases = true

[tool.black]
line-length = 150
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 150

[tool.pytest.ini_options]
testpaths = ["tests"]
