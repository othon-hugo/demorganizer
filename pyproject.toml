[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "demorganizer"
version = "2025.7.0"
description = "demorganizer is designed analyze, simplify, and refactor complex logical conditions."
dependencies = ["tabulate >= 0.9.0"]
requires-python = ">=3.11"
classifiers = ["Development Status :: 4 - Beta", "Programming Language :: Python :: 3.11"]

[project.urls]
Homepage = "https://github.com/othonhugo/demorganizer/"
Repository = "https://github.com/othonhugo/demorganizer.git"
Issues = "https://github.com/othonhugo/demorganizer/issues"

[project.optional-dependencies]
lint = ["flake8"]
dev = ["mypy"]
